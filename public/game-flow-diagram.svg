<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <style>
  .title{font:700 38px Arial,sans-serif;fill:#f8fafc}.sub{font:400 18px Arial,sans-serif;fill:#94a3b8}.h{font:700 20px Arial,sans-serif;fill:#f8fafc}.b{font:400 16px Arial,sans-serif;fill:#cbd5e1}.small{font:400 14px Arial,sans-serif;fill:#cbd5e1}.box{fill:#111827;stroke:#334155;stroke-width:2}.blue{stroke:#38bdf8}.amber{stroke:#fbbf24}.red{stroke:#fb7185}.green{stroke:#4ade80}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
 </style>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<!-- transparent background -->
<text x="800" y="55" text-anchor="middle" class="title">DOCUMENT DUEL · GAME FLOW</text>
<text x="800" y="84" text-anchor="middle" class="sub">A timing-driven psychological battle for control, SAN stability, and HEAT pressure</text>

<!-- main loop -->
<rect x="55" y="125" width="1490" height="325" rx="24" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 10"/>
<text x="80" y="158" class="h">CORE LOOP</text>

<rect x="90" y="200" width="250" height="105" rx="16" class="box blue"/><text x="215" y="233" text-anchor="middle" class="h">1 · CONTROL</text><text x="215" y="262" text-anchor="middle" class="b">Who holds the document?</text><text x="215" y="284" text-anchor="middle" class="small">Ownership = initiative</text>
<rect x="450" y="200" width="250" height="105" rx="16" class="box amber"/><text x="575" y="233" text-anchor="middle" class="h">2 · COMMIT</text><text x="575" y="262" text-anchor="middle" class="b">Toss or Feint</text><text x="575" y="284" text-anchor="middle" class="small">Attack, probe, or bait</text>
<rect x="810" y="200" width="250" height="105" rx="16" class="box amber"/><text x="935" y="233" text-anchor="middle" class="h">3 · READ</text><text x="935" y="262" text-anchor="middle" class="b">Opponent chooses timing</text><text x="935" y="284" text-anchor="middle" class="small">Parry or enter cooldown</text>
<rect x="1170" y="200" width="250" height="105" rx="16" class="box green"/><text x="1295" y="233" text-anchor="middle" class="h">4 · SHIFT</text><text x="1295" y="262" text-anchor="middle" class="b">Resolve the exchange</text><text x="1295" y="284" text-anchor="middle" class="small">Document ownership changes</text>
<path d="M340 252 H445 M700 252 H805 M1060 252 H1165" class="line"/>
<path d="M1295 305 V370 H215 V310" class="line"/>
<text x="750" y="394" text-anchor="middle" class="small">Repeat until resources or match conditions decide the outcome</text>

<!-- defense state -->
<rect x="90" y="500" width="700" height="300" rx="20" class="box"/>
<text x="125" y="540" class="h">DEFENSE STATE MACHINE</text>
<rect x="125" y="590" width="170" height="78" rx="12" class="box blue"/><text x="210" y="625" text-anchor="middle" class="h">IDLE</text><text x="210" y="648" text-anchor="middle" class="small">Press Space</text>
<rect x="365" y="590" width="170" height="78" rx="12" class="box amber"/><text x="450" y="625" text-anchor="middle" class="h">PARRY</text><text x="450" y="648" text-anchor="middle" class="small">Exact timing</text>
<rect x="605" y="590" width="145" height="78" rx="12" class="box red"/><text x="677" y="625" text-anchor="middle" class="h">COOLDOWN</text><text x="677" y="648" text-anchor="middle" class="small">Cannot cancel</text>
<path d="M295 629 H360 M535 629 H600" class="line"/>
<path d="M450 680 V730 H210 V674" class="line"/>
<text x="210" y="752" text-anchor="middle" class="small">No attack → cooldown ends</text><text x="450" y="752" text-anchor="middle" class="small">Attack during Parry → instant success</text><text x="677" y="752" text-anchor="middle" class="small">Attack during cooldown → defend, but punish attacker</text>

<!-- psychology/resources -->
<rect x="850" y="500" width="695" height="300" rx="20" class="box"/>
<text x="885" y="540" class="h">RESOURCE → PSYCHOLOGY FEEDBACK</text>
<text x="885" y="588" class="b">Successful toss</text><text x="1135" y="588" class="small">Opponent SAN ↓ · HEAT ↑</text>
<text x="885" y="625" class="b">Blocked / Parried toss</text><text x="1135" y="625" class="small">Attacker SAN ↓ · HEAT ↑</text>
<text x="885" y="662" class="b">Cooldown hit</text><text x="1135" y="662" class="small">Attacker SAN loss × 1.5</text>
<text x="885" y="699" class="b">SAN below thresholds</text><text x="1135" y="699" class="small">Camera shake → black vignette</text>
<path d="M1200 715 C1400 715 1435 755 1370 770" class="line"/>
<text x="1215" y="780" class="small">pressure rises</text>

<text x="800" y="850" text-anchor="middle" class="sub">Player question: “Do I commit, bait, wait, or risk the Parry?”</text>
</svg>
